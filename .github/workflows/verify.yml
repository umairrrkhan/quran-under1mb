name: Verify Android source
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run Android 7 through 16 framework tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public source
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPO_URL"
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Install cloud build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk-headless maven
          JAVA_PATH=$(readlink -f /usr/lib/jvm/java-21-openjdk-*/bin/javac)
          JAVA_ROOT=$(dirname "$(dirname "$JAVA_PATH")")
          echo "JAVA_HOME=$JAVA_ROOT" >> "$GITHUB_ENV"
          echo "$JAVA_ROOT/bin" >> "$GITHUB_PATH"
          SDK_DIR="$RUNNER_TEMP/quran-sdk"
          mkdir -p "$SDK_DIR"
          curl -fLsS https://dl.google.com/android/repository/platform-36_r02.zip -o "$SDK_DIR/platform.zip"
          unzip -q "$SDK_DIR/platform.zip" -d "$SDK_DIR"
          curl -fLsS https://dl.google.com/android/repository/build-tools_r36_linux.zip -o "$SDK_DIR/tools.zip"
          unzip -q "$SDK_DIR/tools.zip" -d "$SDK_DIR"
          echo "QURAN_ANDROID_JAR=$SDK_DIR/android-36/android.jar" >> "$GITHUB_ENV"
          echo "QURAN_BUILD_TOOLS=$SDK_DIR/android-16" >> "$GITHUB_ENV"
      - name: Verify corpus and released APK
        run: python3 scripts/verify_data.py
      - name: Build under the size cap
        run: python3 scripts/build_android.py
      - name: Android 16 regressions
        if: github.event_name != 'workflow_dispatch' || !inputs.full_matrix
        run: python3 scripts/run_tests.py
      - name: Full Android 7 through 16 matrix
        if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
        run: python3 scripts/run_tests.py --matrix
